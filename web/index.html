<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forma · evidence-based AI fitness coach</title>
<meta name="description" content="A team of AI agents (coach, intake, medical safety, trainer, nutritionist and chef) that builds a sustainable training and nutrition plan grounded in public health guidelines, FDA labels, USDA data and research.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316a34a'/%3E%3Cpath d='M9 22V10h12M9 16h9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true">F</span><div><b>Forma</b><small>an evidence-based coach, run by a team of AI agents</small></div></div>
  <div class="status" id="status"></div>
  <button class="ghost" id="new" type="button">New conversation</button>
</header>
<main class="layout">
  <section class="chat" aria-label="Conversation">
    <ol class="messages" id="messages" aria-live="polite"></ol>
    <div class="working" id="working" hidden><span class="dot"></span><span id="working-text"></span></div>
    <div class="quick" id="quick"></div>
    <form class="composer" id="composer">
      <label class="sr" for="input">Message</label>
      <textarea id="input" rows="1" placeholder="Tell your coach about your goal, your week and your body…" autocomplete="off"></textarea>
      <button type="submit" id="send" aria-label="Send">Send</button>
    </form>
  </section>
  <section class="board" aria-label="Dashboard">
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="live" aria-selected="true">Live</button>
      <button role="tab" data-tab="plan">Plan</button>
      <button role="tab" data-tab="nutrition">Nutrition</button>
      <button role="tab" data-tab="meals">Meals</button>
      <button role="tab" data-tab="safety">Safety</button>
      <button role="tab" data-tab="sources">Sources</button>
    </nav>
    <div class="panel" id="tab-live">
      <div class="network-wrap">
        <svg id="network" viewBox="0 0 440 326" role="img" aria-label="Agent network"></svg>
        <p class="hint">Agents light up as they work. A packet travels along an edge each time one agent hands work to another.</p>
      </div>
      <h3>Activity</h3>
      <ol class="timeline" id="timeline"></ol>
    </div>
    <div class="panel" id="tab-plan" hidden></div>
    <div class="panel" id="tab-nutrition" hidden></div>
    <div class="panel" id="tab-meals" hidden></div>
    <div class="panel" id="tab-safety" hidden></div>
    <div class="panel" id="tab-sources" hidden></div>
  </section>
</main>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
