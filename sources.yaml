datasets:
  - id: fdc-foundation
    title: USDA FoodData Central, Foundation Foods (April 2026)
    url: https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_foundation_food_csv_2026-04-30.zip
    license: public-domain
  - id: fdc-sr-legacy
    title: USDA FoodData Central, SR Legacy (April 2018)
    url: https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_sr_legacy_food_csv_2018-04.zip
    license: public-domain
  - id: exercises
    title: Free Exercise DB (yuhonas/free-exercise-db)
    url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json
    license: unlicense
  - id: openfda-labels
    title: FDA drug labeling via openFDA
    url: https://api.fda.gov/drug/label.json
    license: public-domain
  - id: themealdb
    title: TheMealDB community recipes (fetched at build time, not redistributed)
    url: https://www.themealdb.com/api/json/v1/1/search.php
    license: api-terms

# Medications Forma knows how to screen, grouped by class. Brand names come from the FDA labels.
medications:
  beta_blocker: [metoprolol, atenolol, propranolol, carvedilol, bisoprolol]
  ace_inhibitor: [lisinopril, enalapril, ramipril]
  arb: [losartan, valsartan]
  thiazide_diuretic: [hydrochlorothiazide, chlorthalidone]
  loop_diuretic: [furosemide]
  potassium_sparing_diuretic: [spironolactone]
  calcium_channel_blocker: [amlodipine]
  insulin: [insulin glargine, insulin lispro]
  sulfonylurea: [glipizide, glimepiride, glyburide]
  biguanide: [metformin]
  sglt2_inhibitor: [empagliflozin, dapagliflozin, canagliflozin]
  glp1_agonist: [semaglutide, liraglutide, tirzepatide]
  statin: [atorvastatin, simvastatin, lovastatin, rosuvastatin]
  vitamin_k_antagonist: [warfarin]
  doac: [apixaban, rivaroxaban]
  maoi: [phenelzine, tranylcypromine]
  lithium: [lithium carbonate]
  thyroid_hormone: [levothyroxine]
  ssri: [sertraline, fluoxetine, escitalopram]
  fluoroquinolone: [ciprofloxacin, levofloxacin]
  tetracycline: [doxycycline]
  corticosteroid: [prednisone]
  bisphosphonate: [alendronate]
  stimulant: [methylphenidate, amphetamine]
  nsaid: [ibuprofen, naproxen]
  retinoid: [isotretinoin]
